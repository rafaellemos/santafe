name: Candidato dados.25 — console e instalador Windows
on:
  push:
    branches: ['homologacao/windows-dados15']
    paths: ['dados25/**', 'dados21/**', '.github/workflows/console-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  console:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
      - name: Preparar base e correção conferidas
        run: |
          python windows/preparar.py fonte.tar.gz fonte-estavel
          python dados20/aplicar.py fonte-estavel
          python dados21/aplicar.py fonte-estavel
          python dados25/preparar-windows.py dados25/fonte24.tar.gz fonte windows
      - name: Compilar CLI nativo e testar decisões e erros
        run: |
          mkdir -p resultados25
          make -C fonte/src mingw 'MYCFLAGS=-DLUA_USE_APICHECK' > resultados25/compilacao.log 2>&1
          gcc -std=c99 -Wall -Wextra -Werror dados21/testar-console-simulado.c -o resultados25/simulado.exe
          resultados25/simulado.exe > resultados25/simulado.log
          gcc -std=c99 -Wall -Wextra -Werror dados21/testar-entrada-simulada.c -o resultados25/entrada-simulada.exe
          resultados25/entrada-simulada.exe > resultados25/entrada-simulada.log
      - name: Ctrl+C por protocolo ConPTY próprio, sem teclado global
        run: python dados21/testar-conpty.py fonte/src/santafe.exe resultados25/conpty.json
      - name: Ensaio com console Windows próprio e pipes
        run: python dados21/testar-console-nativo.py fonte/src/santafe.exe resultados25/console.json
      - name: Entrada Unicode por eventos reais de teclado no console exclusivo
        run: python dados21/testar-entrada-nativa.py fonte/src/santafe.exe resultados25/entrada.json
      - name: Repetir núcleo ONFÉ e IBA na distribuição25
        run: |
          make -C fonte/src clean
          python dados25/preparar-bateria.py
          python windows/testar25.py fonte regressao25
      - name: Repetir SLS gerenciador e proteções na distribuição25
        run: python apoio25/testar.py regressao25/candidato regressao25/ferramentas
      - name: Repetir console no interpretador com DLL
        run: python dados21/testar-console-nativo.py regressao25/candidato/src/santafe.exe resultados25/console-dll.json
      - name: Repetir entrada Unicode no interpretador com DLL
        run: python dados21/testar-entrada-nativa.py regressao25/candidato/src/santafe.exe resultados25/entrada-dll.json
      - name: Repetir Ctrl+C por ConPTY no interpretador com DLL
        run: python dados21/testar-conpty.py regressao25/candidato/src/santafe.exe resultados25/conpty-dll.json
      - name: Preparar critérios MSI25 e baseline20 conferido
        run: python -c "print('Criterios MSI25 preparados e baselines preservados')"
      - name: Compilar verificacoes nativas do instalador
        run: python apoio25/compilar-guarda.py regressao25/ferramentas
      - uses: actions/setup-python@v5
        id: msi_python
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Instalacao atualizacao e reversao MSI
        shell: pwsh
        run: |
          & '${{ steps.msi_python.outputs.python-path }}' apoio25/testar-instalador.py regressao25/instalador regressao25/ferramentas regressao25/candidato regressao25/ferramentas/instalador-guarda.dll dados20/baseline-dados16.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Instalar e remover com usuario padrao real
        shell: pwsh
        run: |
          ./apoio25/usuario-padrao.ps1 -Python '${{ steps.msi_python.outputs.python-path }}' -OutputDir regressao25/instalador
      - name: Verificar metadados e recusa de assinatura indevida
        shell: pwsh
        run: ./apoio25/testar-assinatura.ps1 -OutputDir regressao25/instalador -ToolsDir regressao25/ferramentas
      - name: Preparar entrada verificada para Windows11
        run: python apoio25/preparar-windows11.py regressao25/candidato regressao25
      - name: Transportar pacote entre os ambientes de homologacao
        uses: actions/upload-artifact@v4
        with:
          name: dados25-windows11-input
          path: regressao25/windows11-input.zip
          retention-days: 7
      - name: Guardar evidências do candidato e limites de homologação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dados25-console-evidencias
          path: |
            resultados25/*.json
            resultados25/*.log
            fonte/PREPARACAO-WINDOWS.json
            regressao25/*.json
            regressao25/*.log
            regressao25/ferramentas/*.json
            regressao25/ferramentas/*.log
            regressao25/ferramentas/santafe-dados25-windows-x64-portatil.zip
            regressao25/instalador/*.json
            regressao25/instalador/*.log
            regressao25/instalador/santafe-dados25-windows-x64.msi
          if-no-files-found: error
          retention-days: 14

  cliente-windows11:
    needs: console
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
          architecture: 'arm64'
      - uses: actions/download-artifact@v4
        with:
          name: dados25-windows11-input
          path: entrada-ci
      - name: Preparar critérios de homologação25
        shell: pwsh
        run: |
          python dados25/preparar-bateria.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "print('Criterios MSI25 preparados e baselines preservados')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Instalar atualizar e reverter x64 no Windows11 ARM
        shell: pwsh
        run: |
          & '${{ steps.python.outputs.python-path }}' apoio25/testar-windows11.py entrada-ci/windows11-input.zip resultados-windows11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Guardar evidencia sem declarar validacao visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows11-dados25-evidencias
          path: |
            resultados-windows11/*.json
            resultados-windows11/*.log
          retention-days: 14
          if-no-files-found: error
