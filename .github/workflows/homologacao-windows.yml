name: Windows nativo — dados.20 — SLS e gerenciador
on:
  push:
    branches: ['homologacao/windows-dados15']
    paths: ['fonte.tar.gz', 'windows/**', 'dados20/**', '.github/workflows/homologacao-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-dados15
  cancel-in-progress: false
jobs:
  nucleo:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
      - name: Preparar fonte selada e correção isolada
        run: python windows/preparar.py fonte.tar.gz fonte
      - name: Aplicar adaptação dados20
        run: python dados20/aplicar.py fonte
      - name: Compilar e executar a bateria nativa
        run: python windows/testar.py fonte resultados
      - name: SLS e gerenciador nativos
        run: python dados20/testar.py resultados/candidato resultados/ferramentas
      - name: Compilar verificacoes nativas do instalador
        run: python dados20/compilar-guarda.py resultados/ferramentas
      - uses: actions/setup-python@v5
        id: msi_python
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Instalacao atualizacao e reversao MSI
        shell: pwsh
        run: |
          & '${{ steps.msi_python.outputs.python-path }}' dados20/testar-instalador.py resultados/instalador resultados/ferramentas resultados/candidato resultados/ferramentas/instalador-guarda.dll dados20/baseline-dados16.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Instalar e remover com usuario padrao real
        shell: pwsh
        run: |
          ./dados20/usuario-padrao.ps1 -Python '${{ steps.msi_python.outputs.python-path }}' -OutputDir resultados/instalador
      - name: Verificar metadados e recusa de assinatura indevida
        shell: pwsh
        run: ./dados20/testar-assinatura.ps1 -OutputDir resultados/instalador -ToolsDir resultados/ferramentas
      - name: Preparar entrada verificada para Windows11
        run: python dados20/preparar-windows11.py resultados/candidato resultados
      - name: Transportar pacote entre os ambientes de homologacao
        uses: actions/upload-artifact@v4
        with:
          name: dados20-windows11-input
          path: resultados/windows11-input.zip
          retention-days: 7
      - name: Guardar evidências mesmo em caso de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dados15-evidencias
          path: |
            resultados/*.json
            resultados/*.log
            resultados/ferramentas/*.json
            resultados/ferramentas/*.log
            resultados/ferramentas/*.zip
            resultados/instalador/*.json
            resultados/instalador/*.log
            resultados/instalador/santafe-dados20-windows-x64.msi
            fonte/PREPARACAO-WINDOWS.json
            fonte/DADOS20-WINDOWS.json
          if-no-files-found: error
          retention-days: 14
      - name: Declarar o limite da homologação
        if: always()
        shell: pwsh
        run: |
          'Candidato dados.20: núcleo/ONFÉ/IBA em resultado.json; SLS, gerenciador, proteção de caminhos/processos, HTTPS e pacote portátil em ferramentas/resultado.json. Cada relatório distingue testes aprovados de falha/interrupção; a presença do artefato não significa aprovação. Instalador MSI por usuario em instalador/resultado.json. Nao homologa servicos, assinatura Authenticode ou GUI dos editores Windows.' >> $env:GITHUB_STEP_SUMMARY

  cliente-windows11:
    needs: nucleo
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
          architecture: 'arm64'
      - uses: actions/download-artifact@v4
        with:
          name: dados20-windows11-input
          path: entrada-ci
      - name: Instalar atualizar e reverter x64 no Windows11 ARM
        shell: pwsh
        run: |
          & '${{ steps.python.outputs.python-path }}' dados20/testar-windows11.py entrada-ci/windows11-input.zip resultados-windows11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Guardar evidencia sem declarar validacao visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows11-dados20-evidencias
          path: |
            resultados-windows11/*.json
            resultados-windows11/*.log
          retention-days: 14
          if-no-files-found: error
