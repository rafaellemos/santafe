name: Windows nativo — dados.16 — SLS e gerenciador
on:
  push:
    branches: ['homologacao/windows-dados15']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-dados15
  cancel-in-progress: false
jobs:
  nucleo:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
      - name: Preparar fonte selada e correção isolada
        run: python windows/preparar.py fonte.tar.gz fonte
      - name: Aplicar adaptação dados16
        run: python dados16/aplicar.py fonte
      - name: Compilar e executar a bateria nativa
        run: python windows/testar.py fonte resultados
      - name: SLS e gerenciador nativos
        run: python dados16/testar.py resultados/candidato resultados/ferramentas
      - name: Guardar evidências mesmo em caso de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dados15-evidencias
          path: |
            resultados/*.json
            resultados/*.log
            resultados/ferramentas/*.json
            resultados/ferramentas/*.log
            fonte/PREPARACAO-WINDOWS.json
            fonte/DADOS16-WINDOWS.json
          if-no-files-found: error
          retention-days: 14
      - name: Declarar o limite da homologação
        if: always()
        shell: pwsh
        run: |
          'Esta bateria cobre somente núcleo, ONFÉ em memória e IBA estática/dinâmica com DLLs sintéticas. A adaptação SLS/gerenciador está em ensaio adicional; consulte resultados/ferramentas. Não aprova instalação nem editores Windows.' >> $env:GITHUB_STEP_SUMMARY
