# Inclua estes blocos dentro do servidor HTTPS de santafé.dev.br, antes de
# "location /". O proxy preserva o prefixo /carteiro recebido pelo Caminheiro.

location = /carteiro {
    return 308 /carteiro/;
}

location /carteiro/estático/ {
    alias /var/www/santafé.dev.br/carteiro/estático/;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    expires 1h;
}

location /carteiro/ {
    proxy_pass http://127.0.0.1:7100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    client_max_body_size 50m;
}
